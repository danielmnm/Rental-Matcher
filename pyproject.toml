[project]
name = "rental-matcher"
version = "0.1.0"
description = "Universal rental-listing matching tool — canonical schema (Phase 0)"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0,<3.0",
    # migrations.py validates every step's output against the frozen schema
    "jsonschema>=4.18,<5.0",
]

[tool.setuptools.packages.find]
include = ["rental_matcher*"]

[tool.setuptools.package-data]
rental_matcher = ["priors.json"]
