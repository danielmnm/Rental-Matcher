<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rental Matcher</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: #1d2125; background: #fff4e8; }
  main { padding: 20px 22px; }
  h1 { font-size: 17px; margin: 0 0 8px; display: flex; gap: 10px; align-items: center; }
  h1 i { font-style: normal; width: 30px; height: 30px; border-radius: 50%; background: #e8833a; color: #fff; display: grid; place-items: center; font-weight: 700; }
  p { margin: 0 0 14px; }
  button { border: 1px solid #1f6feb; background: #1f6feb; color: #fff; border-radius: 8px; padding: 8px 16px; font-size: 14px; font-weight: 600; cursor: pointer; }
  button.secondary { background: #fff; color: #3d444d; border-color: #d0d7de; font-weight: 500; margin-inline-start: 6px; }
  small { display: block; margin-top: 14px; color: #6e7781; }
</style>
</head>
<body>
<main>
  <h1><i>!</i><span data-i18n="ck_title"></span></h1>
  <p id="text" data-i18n="ck_text"></p>
  <button id="go" data-i18n="ck_go"></button><button id="stop" class="secondary" data-i18n="ck_stop"></button>
  <small data-i18n="ck_never"></small>
</main>
<script src="store.js"></script>
<script src="i18n.js"></script>
<script src="check.js"></script>
</body>
</html>
