<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rental Matcher</title>
<link rel="icon" href="icons/icon32.png">
<style id="cards-css"></style>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: #1d2125; background: #f6f7f9; }
  header { background: #fff; border-bottom: 1px solid #e3e6ea; }
  .top { max-width: 1100px; margin: 0 auto; padding: 14px 20px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .top img { width: 26px; height: 26px; }
  h1 { font-size: 18px; margin: 0; flex: 1; }
  main { max-width: 1100px; margin: 0 auto; padding: 18px 20px 48px; }
  .lead { color: #3d444d; margin: 0 0 14px; }
  .lead small { display: block; color: #6e7781; }
  .prog { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; color: #57606a; font-size: 13px; }
  .prog .bar { flex: 1; height: 6px; background: #e3e6ea; border-radius: 3px; overflow: hidden; }
  .prog .bar > div { height: 100%; background: #1f6feb; width: 0; transition: width .25s; }
  .pair { display: grid; grid-template-columns: 1fr auto 1fr; gap: 16px; align-items: stretch; }
  .vs { align-self: center; font-weight: 700; color: #8a94a3; }
  .side .rm-card { margin: 0; }
  .seg { display: inline-flex; background: #eef1f5; border-radius: 10px; padding: 3px; }
  .seg button { border: 0; background: none; font: inherit; font-size: 13px; padding: 5px 12px; border-radius: 8px; cursor: pointer; color: #57606a; }
  .seg button.on { background: #fff; color: #1d2125; font-weight: 600; box-shadow: 0 1px 3px rgba(16,24,40,.12); }
  .side .rm-foot, .side .rm-detail { display: none; }
  .side .rm-simple { --ph-ratio: 16 / 8; }
  .side { display: flex; flex-direction: column; height: 100%; }
  .side .rm-card { flex: 1; }
  .side .rm-sfoot, .side .rm-heart { display: none; }
  .pick { width: 100%; margin-top: 10px; border: 2px solid #1f6feb; background: #fff; color: #1f6feb; border-radius: 10px; padding: 10px; font-size: 15px;
    font-weight: 700; cursor: pointer; font-family: inherit; transition: background .12s, color .12s, transform .08s; }
  .pick:hover { background: #1f6feb; color: #fff; }
  .pick:active { transform: scale(.98); }
  .row { display: flex; gap: 10px; justify-content: center; margin-top: 16px; flex-wrap: wrap; }
  .btn { border: 1px solid #d0d7de; background: #fff; color: #1d2125; border-radius: 8px; padding: 8px 16px; font-size: 14px; cursor: pointer; font-family: inherit; }
  .btn:hover { border-color: #b9c0c8; }
  .btn.primary { background: #1f6feb; border-color: #1f6feb; color: #fff; font-weight: 600; }
  .btn:disabled { opacity: .5; cursor: default; }
  .box { background: #fff; border: 1px solid #e3e6ea; border-radius: 12px; padding: 16px 18px; margin-top: 18px; }
  .box h2 { font-size: 16px; margin: 0 0 6px; }
  .nums { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; margin: 12px 0; }
  .num { background: #f6f8fa; border-radius: 10px; padding: 10px 12px; }
  .num b { display: block; font-size: 22px; }
  .num span { color: #57606a; font-size: 12px; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; margin-top: 8px; }
  th, td { text-align: start; padding: 7px 8px; border-bottom: 1px solid #eef0f2; }
  th { color: #6e7781; font-weight: 600; font-size: 12px; }
  td.up { color: #1a7f37; font-weight: 600; }
  td.down { color: #b42318; font-weight: 600; }
  .muted { color: #6e7781; }
  .empty { text-align: center; color: #6e7781; padding: 48px 12px; }
  [hidden] { display: none !important; }
  @media (max-width: 760px) { .pair { grid-template-columns: 1fr; } .vs { justify-self: center; } }
</style>
</head>
<body>
<header>
  <div class="top">
    <img src="icons/icon48.png" alt="">
    <h1 data-i18n="cp_title">Which would you rather live in?</h1>
    <div class="seg" id="detail"><button data-d="0" data-i18n="view_simple">Simple</button><button data-d="1" data-i18n="view_detailed">Detailed</button></div>
    <button class="btn" id="back" data-i18n="your_listings">Your listings</button>
  </div>
</header>
<main>
  <p class="lead" id="lead"></p>
  <div class="prog"><span id="count"></span><div class="bar"><div id="fill"></div></div><button class="btn" id="result" disabled></button></div>
  <div id="stage"></div>
  <div class="box" id="report" hidden></div>
</main>
<script src="store.js"></script>
<script src="i18n.js"></script>
<script src="cards.js"></script>
<script src="compare.js"></script>
</body>
</html>
